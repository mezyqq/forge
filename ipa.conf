# Forge — IDE для iOS: редактор + Claude-агент. Проекты хранит в формате ipab.
NAME="Forge"
BUNDLE_ID="com.mezyq.forge"
VERSION="1.0"
BUILD="13"
MIN_IOS="16.0"
FRAMEWORKS="Foundation UIKit SwiftUI Security JavaScriptCore WebKit CryptoKit PhotosUI Speech AVFoundation Network"
LIBS="compression"
CFLAGS="-DLUA_USE_IOS -Wno-everything"
SWIFTFLAGS=""
LDFLAGS="-Wl,-map,$PROJ/build/$NAME.map"   # карта символов — для расшифровки отчётов о вылетах
BRIDGING_HEADER="src/Bridging.h"
ICON="res/icon.png"
ENTITLEMENTS=""
RELEASES="$PROJ/releases"         # релизы Forge лежат рядом с исходниками

# Встроенный компилятор: git clone https://github.com/mezyqq/ios-compiler compiler, там ./build-llvm.sh,
# make и make toolchain. Если он собран — Forge собирает C/ObjC/C++ приложения в .ipa прямо на телефоне.
if [ -f "$PROJ/compiler/out/libioscc.a" ] && [ -d "$PROJ/compiler/out/toolchain" ]; then
	SWIFTFLAGS="$SWIFTFLAGS -DFORGE_COMPILER"
	LIBS="$LIBS c++"
	LDFLAGS="$LDFLAGS $PROJ/compiler/out/libioscc.a $(echo "$PROJ"/compiler/llvm-ios-build/lib/*.a)"
	EXTRA_RES="compiler/out/toolchain"
fi
