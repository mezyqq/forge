# Forge — IDE для iOS: редактор + Claude-агент. Проекты хранит в формате ipab.
NAME="Forge"
BUNDLE_ID="com.mezyq.forge"
VERSION="0.4"
BUILD="4"
MIN_IOS="16.0"
FRAMEWORKS="Foundation UIKit SwiftUI Security JavaScriptCore WebKit CryptoKit"
LIBS="compression"
CFLAGS="-DLUA_USE_IOS -Wno-everything"
SWIFTFLAGS=""
LDFLAGS="-Wl,-map,$PROJ/build/$NAME.map"   # карта символов — для расшифровки отчётов о вылетах
BRIDGING_HEADER="src/Bridging.h"
ICON="res/icon.png"
ENTITLEMENTS=""
RELEASES="$PROJ/releases"         # релизы Forge лежат рядом с исходниками
